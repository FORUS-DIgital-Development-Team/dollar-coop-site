name: Verify dollar settlement candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test sandbox/ledger.test.mjs preview/server.test.mjs
      - run: node --check sandbox/testnet.mjs
